name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    name: Verify release artifacts
    runs-on: ubuntu-latest
    env:
      SOURCE_DATE_EPOCH: "1787443200"
      PYTHONHASHSEED: "0"
    steps:
      - name: Check out exact tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pinned uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
      - name: Sync and verify
        run: |
          uv sync --frozen --extra dev
          package_version=$(uv run --frozen --no-sync python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "$GITHUB_REF_NAME" = "v$package_version"
          uv run --frozen --no-sync python validate_release.py --full
          uv run --frozen --no-sync python scripts/stage_release_assets.py release-assets
      - name: Upload verified artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: phytobench-release-dist
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: phytobench-release-dist
          path: release-dist
      - name: Reverify hashes
        working-directory: release-dist
        run: sha256sum --check RELEASE_SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_channel=--latest
          case "$GITHUB_REF_NAME" in
            *a[0-9]*|*b[0-9]*|*rc[0-9]*|*dev[0-9]*) release_channel=--prerelease ;;
          esac
          gh release create "$GITHUB_REF_NAME" release-dist/* \
            --repo "$GITHUB_REPOSITORY" --generate-notes --verify-tag \
            "$release_channel"
