name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync locked environment
        run: uv sync --frozen --extra dev
      - name: Test
        run: uv run --frozen --no-sync pytest --cov=phytobench --cov-report=term-missing
      - name: Lint and format
        if: matrix.python-version == '3.12'
        run: |
          uv run --frozen --no-sync ruff check .
          uv run --frozen --no-sync ruff format --check .
          uv run --frozen --no-sync pre-commit run --all-files
      - name: Privacy scan
        if: matrix.python-version == '3.12'
        run: uv run --frozen --no-sync python scripts/privacy_scan.py .
      - name: Replay empty empirical ceiling
        run: |
          uv run --frozen --no-sync phytobench audit \
            --sources registry/LOCKED_SOURCE_REGISTRY.json \
            --rows registry/LOCKED_BENCHMARK_ROWS.json \
            --contract registry/LOCKED_FREEZE_CONTRACT.json
          if uv run --frozen --no-sync phytobench audit \
            --sources registry/LOCKED_SOURCE_REGISTRY.json \
            --rows registry/LOCKED_BENCHMARK_ROWS.json \
            --contract registry/LOCKED_FREEZE_CONTRACT.json --require-ready; then
            exit 1
          fi

  package:
    name: Reproducible package and installed-wheel replay
    needs: test
    runs-on: ubuntu-latest
    env:
      SOURCE_DATE_EPOCH: "1787443200"
      PYTHONHASHSEED: "0"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pinned uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync locked verification environment
        run: uv sync --frozen --extra dev
      - name: Build twice and compare
        run: uv run --frozen --no-sync python validate_release.py --full
      - name: Scan and replay installed wheel
        run: |
          mkdir -p "$RUNNER_TEMP/wheel-tree" "$RUNNER_TEMP/sdist-tree"
          uv run --frozen --no-sync python -m zipfile -e \
            dist/phytobench-0.1.0a1-py3-none-any.whl "$RUNNER_TEMP/wheel-tree"
          uv run --frozen --no-sync python -m tarfile -e \
            dist/phytobench-0.1.0a1.tar.gz "$RUNNER_TEMP/sdist-tree"
          uv run --frozen --no-sync python scripts/privacy_scan.py "$RUNNER_TEMP/wheel-tree"
          uv run --frozen --no-sync python scripts/privacy_scan.py "$RUNNER_TEMP/sdist-tree"
          uv venv "$RUNNER_TEMP/wheel-venv" --python 3.12
          uv pip install --python "$RUNNER_TEMP/wheel-venv/bin/python" \
            dist/phytobench-0.1.0a1-py3-none-any.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-venv/bin/phytobench" --version
          "$RUNNER_TEMP/wheel-venv/bin/phytobench" audit \
            --sources "$GITHUB_WORKSPACE/registry/LOCKED_SOURCE_REGISTRY.json" \
            --rows "$GITHUB_WORKSPACE/registry/LOCKED_BENCHMARK_ROWS.json" \
            --contract "$GITHUB_WORKSPACE/registry/LOCKED_FREEZE_CONTRACT.json"
      - name: Upload verified artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phytobench-dist
          path: dist/*
          if-no-files-found: error
          retention-days: 14
