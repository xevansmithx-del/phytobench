[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phytobench"
version = "0.1.0a1"
description = "Fail-closed plant benchmark intake, blinding, provenance, and leakage auditor"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{name = "Evan Smith"}]
keywords = [
  "bioinformatics",
  "benchmarking",
  "plant-genomics",
  "provenance",
  "reproducibility",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = ["jsonschema>=4.23,<5"]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "pre-commit>=4,<5",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.9,<1",
  "setuptools>=75,<85",
  "twine>=5,<7",
  "wheel>=0.45,<1",
]

[project.scripts]
phytobench = "phytobench.cli:main"

[project.urls]
Homepage = "https://github.com/xevansmithx-del/phytobench"
Repository = "https://github.com/xevansmithx-del/phytobench"
Issues = "https://github.com/xevansmithx-del/phytobench/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
phytobench = ["schema/*.json"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
